<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Donut Market</title>
  <meta name="description" content="Log in or open a Donut Market account and start trading with a full balance of Donut Coins." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍩</text></svg>" />
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/core.js"></script>
</head>
<body>
  <div data-shell="nav"></div>

  <main class="auth-wrap">
    <div class="auth-card card">
      <a href="../index.html" class="nav-logo"><span class="donut-mark">🍩</span> Donut Market</a>
      <p class="muted" style="text-align:center;font-size:13.5px">Trade a simulated exchange with fictional money.</p>

      <div class="auth-tabs" id="auth-tabs">
        <button class="auth-tab active" data-mode="login" type="button">Log in</button>
        <button class="auth-tab" data-mode="signup" type="button">Sign up</button>
      </div>

      <form id="auth-form" novalidate>
        <div class="form-group" id="username-group" hidden>
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" placeholder="glazehunter" />
          <div class="hint">3–18 characters. Shown on the leaderboard.</div>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required />
          <div class="hint" id="password-hint">At least 8 characters.</div>
        </div>

        <div id="auth-error"></div>

        <button type="submit" class="btn btn-primary btn-block" id="auth-submit">Log in</button>
      </form>

      <p class="form-hint" id="auth-switch-hint">
        New here? <a href="#" data-switch="signup">Create an account</a>
      </p>
    </div>
  </main>

  <div data-shell="footer"></div>

  <script src="../js/api.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/pages/login.js"></script>
</body>
</html>
