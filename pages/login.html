<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Donut Market</title>
  <meta name="description" content="Log in or create your Donut Market account to start trading." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍩</text></svg>" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>

  <!-- ==================== NAVBAR ==================== -->
  <header class="navbar">
    <div class="container nav-inner">
      <a href="../index.html" class="nav-logo">
        <span class="donut-mark">🍩</span> Donut Market
      </a>

      <nav class="nav-links" aria-label="Primary">
        <a href="../index.html">Home</a>
        <a href="market.html">Market</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="leaderboard.html">Leaderboard</a>
      </nav>

      <div class="nav-actions">
        <a href="login.html" class="btn btn-primary btn-sm">Login</a>
      </div>

      <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>

    <div class="mobile-menu glass">
      <a href="../index.html">Home</a>
      <a href="market.html">Market</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="leaderboard.html">Leaderboard</a>
      <a href="login.html" class="active">Login</a>
    </div>
  </header>

  <main class="auth-wrap">
    <div class="auth-card glass reveal">
      <a href="../index.html" class="nav-logo"><span class="donut-mark">🍩</span> Donut Market</a>

      <div class="auth-tabs" id="auth-tabs">
        <button class="auth-tab active" data-tab="login">Log In</button>
        <button class="auth-tab" data-tab="signup">Sign Up</button>
      </div>

      <!-- ==================== LOGIN FORM ==================== -->
      <form id="login-form" data-panel="login">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log In</button>
        <p class="form-hint">New here? <a href="#" data-switch="signup">Create an account</a></p>
      </form>

      <!-- ==================== SIGNUP FORM ==================== -->
      <form id="signup-form" data-panel="signup" style="display:none;">
        <div class="form-group">
          <label for="signup-username">Username</label>
          <input type="text" id="signup-username" placeholder="GlazeGoblin" required />
        </div>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account · Get 10,000 DC</button>
        <p class="form-hint">Already trading? <a href="#" data-switch="login">Log in</a></p>
      </form>
    </div>
  </main>

  <script src="../js/main.js"></script>
  <script src="../js/api.js"></script>
  <script>
    // Tab + inline-link switching between Log In and Sign Up panels.
    function setPanel(name) {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.toggle('active', t.getAttribute('data-tab') === name));
      document.querySelectorAll('[data-panel]').forEach(p => p.style.display = p.getAttribute('data-panel') === name ? 'block' : 'none');
    }

    document.getElementById('auth-tabs').addEventListener('click', (e) => {
      const tab = e.target.closest('.auth-tab');
      if (tab) setPanel(tab.getAttribute('data-tab'));
    });

    document.querySelectorAll('[data-switch]').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        setPanel(link.getAttribute('data-switch'));
      });
    });

    // Real signup/login against your Express + MongoDB backend (js/api.js).
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;

      btn.textContent = 'Logging in…';
      btn.disabled = true;
      const { error } = await DM_DB.signIn(email, password);
      btn.disabled = false;
      btn.textContent = 'Log In';

      if (error) {
        DM.openToast(error.message);
        return;
      }
      DM.openToast('Welcome back!');
      window.location.href = 'portfolio.html';
    });

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      const username = document.getElementById('signup-username').value;
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;

      btn.textContent = 'Creating account…';
      btn.disabled = true;
      const { error } = await DM_DB.signUp(username, email, password);
      btn.disabled = false;
      btn.textContent = 'Create Account · Get 10,000 DC';

      if (error) {
        DM.openToast(error.message);
        return;
      }
      DM.openToast('Account created! Welcome to Donut Market.');
      window.location.href = 'portfolio.html';
    });
  </script>
</body>
</html>
